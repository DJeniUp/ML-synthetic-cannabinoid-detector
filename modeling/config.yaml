target_id: "CHEMBL218"
activity_types:
  - "Ki"
  - "IC50"
  - "EC50"
  - "Kd"
cutoff_year: 2017
threshold: 6.5
penalty: 5.0

data:
  raw_path: "../data/cb1_raw.csv"
  train_path: "../data/train.csv"
  test_path: "../data/test.csv"

fingerprint:
  radius: 2
  n_bits: 2048

xgboost:
  n_estimators: 826
  learning_rate: 0.03078822483399053
  max_depth: 7
  subsample: 0.5859541203469838
  colsample_bytree: 0.770842149853944
  min_child_weight: 10
  reg_alpha: 0.0005794263358536707
  reg_lambda: 0.025641928099808548
  random_state: 42
  n_jobs: -1

mlflow:
  experiment_name: "cb1-cannabinoid-detector"
  tracking_uri: "sqlite:///mlruns.db"

model:
  save_path: "models/xgb_model.json"
